[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formrec"
version = "0.1.0"
description = "DB-grounded handwritten form recognition: multi-column record retrieval and detection-free key-information extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "pillow", "rapidfuzz", "tqdm"]

[project.optional-dependencies]
train = ["torch", "einops", "safetensors", "transformers"]
kie = ["pyyaml", "requests"]
kie_general = ["opencv-python"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
